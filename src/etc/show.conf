# miku-voicebank - 卸载演出配置
#
# 这个文件是 conffile：apt 升级/卸载时会保留你的修改。
# 所有键都可以用环境变量覆盖，加 MIKU_ 前缀即可，例如 MIKU_NO_AUDIO=1。

# 播放的歌曲。
#   AUDIO     = 本地文件路径，留空表示不用本地文件
#   AUDIO_URL = 下载地址，AUDIO 为空时用它；下完会缓存起来，下次直接用缓存
# 打包时由 tools/build_deb.py 填入：随包附带音频就写 AUDIO，改成网络获取就写 AUDIO_URL。
AUDIO=
AUDIO_URL=https://fms.uiero.com/downloads/mkrm.mp3

# 下载缓存放哪（留空 = /var/cache/miku-voicebank/，普通用户跑时退到 ~/.cache/miku-voicebank/）
AUDIO_CACHE=

# 下载超时与重试次数
AUDIO_FETCH_TIMEOUT=30
AUDIO_FETCH_RETRIES=2

# 播放器：auto | mpv | ffplay | cvlc | mpg123 | mplayer | pw-play | paplay | play | aplay | none
# auto 会按音频格式挑：mp3 只会选能解码 mp3 的（mpv / ffplay / vlc / mpg123）
PLAYER=auto

# 从歌曲的第几秒开始播放。0 = 从头（这段录音前面还有一段安静的前奏）。
AUDIO_START=0

# 歌词整体平移秒数，用来微调对齐；负数表示歌词提前。
# 可用 `miku-voicebank-show --calibrate` 边听边调，按 s 保存到 ~/.config/miku-voicebank/show.conf
AUDIO_OFFSET=0

# 1 = 不放声音，只输出歌词
NO_AUDIO=0

# 进度条样式：inline（固定在最后一行刷新）| scroll（像视频里那样一行行刷）| off
STATUS_STYLE=inline

# 0 = 关闭颜色
COLOR=1

# 演出速度倍率，1 = 正常。仅用于测试，例如 MIKU_SPEED=40
SPEED=1.0

# 1 = 即使没有终端（输出被重定向）也老老实实演满全场
FORCE=0

# 1 = 演出开始前，先杀掉残留的旧播放进程（上次被 Ctrl+C 打断、或终端被关掉时留下的）
KILL_STRAY=1

# 卸载摘要里显示的数字，纯装饰
PACK_COUNT=51
TOTAL_SIZE=5.4 GiB
